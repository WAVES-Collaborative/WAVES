# Copy to config.yml and edit per dataset. config.yml is gitignored.

study:
  name: "WAVES study"
  timezone: "America/Chicago"
  sampling_frequency: 100
  n_workers: 2

data:
  raw_path: "data/2_INTERIM/RAW"
  raw_pattern: ".*\\.(gt3x|cwa|bin)$"

# format.type:
#   "binary"     -> GGIR's native readers for .gt3x / .cwa / .bin
#   "custom_csv" -> GGIR::read.myacc.csv with csv_spec below
format:
  type: "binary"

